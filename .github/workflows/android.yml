name: Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare offline PNG app logos
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/fetch_brand_icons.py
          python3 scripts/normalize_brand_icons.py
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: samsung-tv-remote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Assemble unsigned release APK for private signing
        run: gradle :app:assembleRelease --no-daemon
      - name: Prepare private signing inputs
        run: |
          mkdir -p signing-input
          cp app/build/outputs/apk/release/app-release-unsigned.apk signing-input/unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-input/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-input/zipalign
      - name: Upload unsigned release signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: samsung-tv-remote-unsigned
          path: signing-input/
          retention-days: 7
